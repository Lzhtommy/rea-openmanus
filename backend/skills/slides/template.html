<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deck</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b; --accent: #1f5eff; --accent-2: #00a37a; --line: #e6e6e6;
    --font: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #2b2b2b; font-family: var(--font); color: var(--fg); }
  .deck { position: relative; width: 1280px; height: 720px; transform-origin: 0 0; }
  section.slide { position: absolute; inset: 0; width: 1280px; height: 720px; padding: 64px 80px; background: var(--bg);
    display: none; flex-direction: column; overflow: hidden; }
  section.slide.active { display: flex; }
  aside.notes { display: none; }
  h1 { font-size: 64px; line-height: 1.15; margin: 0 0 24px; font-weight: 700; }
  h2 { font-size: 44px; line-height: 1.2; margin: 0 0 32px; font-weight: 700; }
  p, li { font-size: 26px; line-height: 1.5; }
  ul { margin: 0; padding-left: 1.2em; } li { margin: 0 0 14px; } li::marker { color: var(--accent); }
  .muted { color: var(--muted); }
  .kicker { font-size: 20px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; font-weight: 600; }
  .footer { position: absolute; left: 80px; right: 80px; bottom: 28px; display: flex; justify-content: space-between; font-size: 16px; color: var(--muted); }
  /* layouts */
  .slide.title { justify-content: center; background: linear-gradient(135deg, #0d1b4c, #1f5eff); color: #fff; }
  .slide.title .muted { color: rgba(255,255,255,.75); }
  .slide.section { justify-content: center; background: var(--fg); color: #fff; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; flex: 1; min-height: 0; }
  .slide.image { padding: 0; } .slide.image img { width: 100%; height: 100%; object-fit: cover; }
  .slide.image .caption { position: absolute; left: 80px; bottom: 64px; color: #fff; font-size: 40px; font-weight: 700; text-shadow: 0 2px 16px rgba(0,0,0,.5); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-top: 24px; }
  .stat .n { font-size: 72px; font-weight: 800; color: var(--accent); line-height: 1; } .stat .l { font-size: 22px; color: var(--muted); margin-top: 12px; }
  .slide.quote { justify-content: center; } .slide.quote blockquote { font-size: 44px; line-height: 1.4; margin: 0; border-left: 8px solid var(--accent); padding-left: 32px; }
  table { border-collapse: collapse; font-size: 22px; width: 100%; } th, td { border-bottom: 1px solid var(--line); padding: 12px 16px; text-align: left; } th { color: var(--muted); font-weight: 600; }
  .chart { flex: 1; min-height: 0; position: relative; }
  /* viewer chrome (hidden when exporting) */
  .deck-ui { position: fixed; right: 16px; bottom: 12px; color: #ccc; font: 14px var(--font); }
  html.exporting .deck-ui { display: none; } html.exporting body { background: none; }
</style>
</head>
<body>
<div class="deck">

  <section class="slide title">
    <div class="kicker">2026 · 行业研究</div>
    <h1>标题写结论，而不是话题</h1>
    <p class="muted">副标题 · 作者 · 日期</p>
    <aside class="notes">开场：一句话说明这份材料要回答的问题。</aside>
  </section>

  <section class="slide content">
    <h2>每页一个观点：标题就是这页的结论</h2>
    <ul>
      <li>要点用短句，动词开头</li>
      <li>数字配单位和来源</li>
      <li>超过 6 条就拆成两页</li>
    </ul>
    <div class="footer"><span>来源：示例</span><span class="page"></span></div>
  </section>

  <section class="slide two-col-slide">
    <h2>左文右图（或图表）</h2>
    <div class="two-col">
      <div><p>说明文字放左侧，图表放右侧，让读者先看结论再看证据。</p></div>
      <div class="chart"><canvas id="c1"></canvas></div>
    </div>
  </section>

  <section class="slide">
    <h2>关键数字</h2>
    <div class="stats">
      <div class="stat"><div class="n">82亿</div><div class="l">2026 年市场规模（美元）</div></div>
      <div class="stat"><div class="n">31%</div><div class="l">年复合增长率</div></div>
      <div class="stat"><div class="n">3×</div><div class="l">三年增长倍数</div></div>
    </div>
  </section>

</div>
<div class="deck-ui"><span id="pos"></span> · ← → 翻页</div>
<script>
  // Viewer: one slide at a time, scaled to the window. slides_export isolates each slide itself.
  const slides = [...document.querySelectorAll("section.slide")];
  let i = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1)) || 1) - 1));
  function fit() {
    const s = Math.min(innerWidth / 1280, innerHeight / 720), deck = document.querySelector(".deck");
    deck.style.transform = `scale(${s})`;
    deck.style.position = "absolute"; deck.style.left = (innerWidth - 1280 * s) / 2 + "px"; deck.style.top = (innerHeight - 720 * s) / 2 + "px";
  }
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => s.classList.toggle("active", k === i));
    document.querySelectorAll(".page").forEach((p) => (p.textContent = ""));
    slides[i].querySelectorAll(".page").forEach((p) => (p.textContent = `${i + 1} / ${slides.length}`));
    document.getElementById("pos").textContent = `${i + 1} / ${slides.length}`;
    history.replaceState(null, "", `#${i + 1}`);
  }
  addEventListener("keydown", (e) => { if (["ArrowRight", "PageDown", " "].includes(e.key)) show(i + 1); if (["ArrowLeft", "PageUp"].includes(e.key)) show(i - 1); });
  addEventListener("click", (e) => { if (!e.target.closest("a,button,canvas")) show(e.clientX > innerWidth / 2 ? i + 1 : i - 1); });
  addEventListener("resize", fit);
  slides.forEach((s) => s.classList.add("active")); // let charts measure every slide once
  if (window.Chart) new Chart(document.getElementById("c1"), { type: "bar", options: { animation: false, maintainAspectRatio: false, plugins: { legend: { display: false } } },
    data: { labels: ["2023", "2024", "2025", "2026"], datasets: [{ data: [28, 41, 63, 82], backgroundColor: "#1f5eff" }] } });
  fit(); show(i);
</script>
</body>
</html>
