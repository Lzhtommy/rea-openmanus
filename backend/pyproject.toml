[project]
name = "manus-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "mcp>=1.20",
    "openai>=1.60",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
